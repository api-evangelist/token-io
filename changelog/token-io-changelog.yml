description: >-
  Token.io does not publish a conventional release-notes page. It publishes a numbered Technical
  Bulletin series inside the developer docs, one page per notice, each carrying an issue date and a
  "What's changing? / Does this change affect you?" structure. 32 bulletins are listed in llms.txt. The series is the advance-notice channel the backward-compatibility policy commits to, and
  the striking thing about its content is that most entries are not about Token.io's own API at
  all — they are notices about the CONNECTED BANKS, which is the honest shape of change for an
  aggregation platform. Current version markers are the API path generations (v1 and v2), not a
  release number.
