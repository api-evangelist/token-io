description: Token.io is an Open Banking infrastructure provider offering A2A (Account-to-Account) payments
  and account information services across Europe. Founded in 2016 and FCA-authorised since 2018, Token.io
  was the first payment initiation service provider to conduct an end-to-end PSD2-compliant Open Banking
  transaction. The Token.io platform connects developers and TPPs to over 4,000 banks via a single standardised
  API supporting Payment Initiation Services (PIS), Account Information Services (AIS), Variable Recurring
  Payments (VRP), refunds, payouts, settlement accounts, account verification, and Pay-by-Link checkout.
  Used by merchants, PSPs, fintechs, PFM apps, and platform businesses to replace card-rail payments and
  aggregate multibank data.
