components:
  schemas:
    Money:
      required:
      - currency
      - value
      type: object
      properties:
        currency:
          maxLength: 3
          minLength: 3
          type: string
          description: ISO4217 - 3 letter currency code such as "USD" or "EUR".
        value:
          type: string
          description: Double amount in the string format.
      description: Represents a monetary value.
    AccountDetails:
      required:
      - accountType
      - identifier
      properties:
        identifier:
          type: string
          description: Bank account identifier.
          example: '0532013000'
        accountType:
          type: string
          description: Type of the account.
          enum:
          - CHECKING
          - SAVING
          - LOAN
          - CARD
          - OTHER
        status:
          type: string
          description: Status of account. E.g., "Active/Inactive/Frozen/Dormant".
          example: Active
        metadata:
          type: array
          description: Additional account metadata.
          example:
          - key: APY
            value: '0.0239'
          items:
            $ref: '#/components/schemas/Entry'
      description: Optional account details. Structure of the data is dependent on the underlying bank and is subject to change.
    TransactionsPage:
      required:
      - transactions
      type: object
      properties:
        offset:
          type: string
          description: The page offset.
        transactions:
          type: array
          description: A list of transactions.
          items:
            $ref: '#/components/schemas/Transaction'
      description: Represents a page of transactions.
    TransactionStatus:
      type: string
      description: The transaction status.
      enum:
      - PROCESSING
      - SUCCESS
      - FAILURE_INSUFFICIENT_FUNDS
      - FAILURE_INVALID_CURRENCY
      - FAILURE_PERMISSION_DENIED
      - FAILURE_INVALID_AMOUNT
      - FAILURE_EXPIRED
      - FAILURE_UNSUPPORTED_DESTINATION
      - FAILURE_GENERIC
      - INITIATED
    Transaction:
      required:
      - amount
      - description
      - id
      - status
      - type
      type: object
      properties:
        id:
          type: string
          description: The transaction identifier.
        type:
          type: string
          description: The transaction type.
          enum:
          - DEBIT
          - CREDIT
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          description: The description of the transaction.
        tokenId:
          type: string
          description: The token consent identifier.Points to the token, only set for Token transactions.
        tokenTransferId:
          type: string
          description: The token transfer identifier. Points to the token transfer, only set for Token transactions.
        createdAt:
          type: string
          description: The time of transaction.
          format: date-time
      description: Represents a transaction.
    Account:
      required:
      - accountDetails
      - accountFeatures
      - name
      properties:
        name:
          type: string
          description: Account name.
        accountFeatures:
          $ref: '#/components/schemas/Account_accountFeatures'
        accountDetails:
          type: array
          items:
            $ref: '#/components/schemas/AccountDetails'
      description: Optional account details. Structure of the data is dependent on the underlying bank and is subject to change.
      example:
      - account:
          name: Example Account Name
          accountFeatures:
            supportsInformation: 'true'
            supportsSendPayment: 'true'
            supportsReceivePayment: 'true'
          accountDetails:
            accountHolderName: John Doe
            type: CARD
            status: Active
            accountIdentifiers:
              gbDomestic:
                sortCode: '123456'
                accountNumber: '12345678'
    Account_accountFeatures:
      type: object
      properties:
        supportsInformation:
          type: boolean
        supportsSendPayment:
          type: boolean
        supportsReceivePayment:
          type: boolean
    Entry:
      required:
      - key
      - value
      type: object
      properties:
        key:
          type: string
          description: The item key.
        value:
          type: string
          description: The item value.
      description: Represents a key-value entry; used to define string metadata items.
    Balance:
      required:
      - available
      - current
      type: object
      properties:
        current:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        updatedAt:
          type: string
          description: The time of the balance
          format: date-time
      description: Represents account balance.
    PaymentNotFoundError:
      required:
      - paymentId
      type: object
      properties:
        errorCode:
          example: NOT_FOUND
        paymentId:
          type: string
          description: The requested entity, the `paymentID`, was not found.
          example: pm2:12345abcd:abcde
      description: 'The error object returned when given payment cannot be found: ResourceNotFound.'
      allOf:
      - $ref: '#/components/schemas/ErrorWithCode'
    inline_response_429:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ResourceExhaustedError'
    Cma9AccountDetailsPartyType:
      type: string
      description: The party type, in a coded form.
      example: JOINT
      default: INVALID_PARTY_TYPE
      enum:
      - INVALID_PARTY_TYPE
      - DELEGATE
      - JOINT
      - SOLE
    PolishApiTypeOfProxy:
      type: string
      description: The type of user's power of attorney for the payment account; required when the relationship type is an account representative.
      example: GENERAL
      default: INVALID_TYPE_OF_PROXY
      enum:
      - INVALID_TYPE_OF_PROXY
      - GENERAL
      - SPECIAL
      - ADMINISTRATOR
      - USER
    AccountDetails_2:
      type: object
      required:
      - identifier
      - accountIdentifiers
      - type
      - accountFeautures
      properties:
        accountHolderName:
          type: string
          description: The name of the account holder/owner.
          example: John Arthur Smith
        bic:
          type: string
          description: The Business Identifier Code (BIC), <a href="https://www.iso.org/standard/84108.html" target="_blank">ISO 9362</a>, is the SWIFT Address assigned to a bank in order to send automated payments quickly and accurately to the banks concerned. It uniquely identifies the name and country, (and sometimes the branch) of the bank involved. BICs are often called SWIFT Codes and can be either 8 or 11 characters long."
          example: BOFIIE2D
        identifier:
          type: string
          description: The type of `accountIdentifier` being used, <i>e.g.</i>, bban, gbDomestic, iban, msisdn, pan or token. The `identifier` is displayed if an account is returned by the bank.
          example: iban
        accountIdentifiers:
          type: array
          description: The account numbers and other strings that identify this as a unique bank account. The `accountidentifiers` are displayed if an account is returned by the bank
          items:
            $ref: '#/components/schemas/AccountIdentifier'
        metadata:
          type: array
