openapi: 3.2.0
info:
  title: Token Io Accounts API
  version: '1.0'
  description: 'Operations tagged accounts across 3 of this provider''s published API definitions: token-io-bank-integration-openapi.json, token-io-openapi.yml, token-io-rest-api-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
- url: https://api.token.io
- url: https://api.token.io/v1
tags:
- name: Accounts
  description: Accounts Service - Implemented by bank to support access to account information.
paths:
  /accounts/{bankAccountId}/balance:
    get:
      tags:
      - Accounts
      summary: Get account balance
      description: Returns the current balance of the given account.
      operationId: getAccountBalance
      parameters:
      - name: token-consent-id
        in: header
        description: The Consent/Token indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-tpp-id
        in: header
        description: The TPP indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-account-holder-id
        in: header
        description: The account holder indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: bankAccountId
        in: path
        description: The bank account identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The bank acccount balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          description: The specified account was not found.
        default:
          description: Unexpected error
      security:
      - BasicAuth: []
      - Bearer: []
      x-hideTryItPanel: true
    servers:
    - url: /
  /accounts/{bankAccountId}/transactions:
    get:
      tags:
      - Accounts
      summary: Get account transactions
      description: Returns the transactions that occurred in the given bank account.
      operationId: getAccountTransactions
      parameters:
      - name: token-consent-id
        in: header
        description: The Consent/Token indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: bankAccountId
        in: path
        description: The bank account identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        description: The number of results per page.
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
      - name: offset
        in: query
        description: The result offset for pagination.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: startDate
        in: query
        description: A filter for start booking date of transactions
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: A filter for end booking date of transactions
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsPage'
        '401':
          description: Access token is missing or invalid
        '404':
          description: The specified account was not found.
        default:
          description: Unexpected error
      security:
      - BasicAuth: []
      - Bearer: []
      x-hideTryItPanel: true
    servers:
    - url: /
  /accounts/{bankAccountId}/transactions/{transactionId}:
    get:
      tags:
      - Accounts
      summary: Get account transactions for given bank
      description: Returns the transactions that occurred in the given bank account by their unique IDs.
      operationId: getAccountTransactionForId
      parameters:
      - name: token-consent-id
        in: header
        description: The consent/Token indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-tpp-id
        in: header
        description: The TPP indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-account-holder-id
        in: header
        description: The account holder indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: bankAccountId
        in: path
        description: The bank account identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: transactionId
        in: path
        description: The transaction identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Access token is missing or invalid
        '404':
          description: The specified account or transaction was not found.
        default:
          description: Unexpected error
      security:
      - BasicAuth: []
      - Bearer: []
      x-hideTryItPanel: true
    servers:
    - url: /
  /accounts/{bankAccountId}:
    get:
      tags:
      - Accounts
      summary: Get account
      description: Retrieves the given bank account.
      operationId: getAccount
      parameters:
      - name: token-consent-id
        in: header
        description: The Consent/Token indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-tpp-id
        in: header
        description: The TPP indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: token-account-holder-id
        in: header
        description: The account holder indentifier
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: bankAccountId
        in: path
        description: The bank account identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Access token is missing or invalid
        '404':
          description: The specified account was not found.
        default:
          description: Unexpected error
      security:
      - BasicAuth: []
      - Bearer: []
      x-hideTryItPanel: true
    delete:
      tags:
      - Accounts
      summary: Delete account
      description: Used when a PSU at a TPP unlinks their account.
      operationId: deleteAccount
      parameters:
      - name: bankAccountId
        in: path
        description: The bank account identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          description: Access token is missing or invalid
        default:
          description: Unexpected error
      security:
      - BasicAuth: []
      - Bearer: []
      x-hideTryItPanel: true
    servers:
    - url: /
  /accounts:
    get:
      tags:
      - Accounts
      summary: Get information for all accounts
      description: The `GET /accounts` endpoint retrieves information for all bank accounts.
      operationId: GatewayService.GetAccounts
      parameters:
      - name: on-behalf-of
        in: header
        description: The `tokenId` represents the consent granted by the user (PSU).
        schema:
          type: string
        required: true
        example: ta:3eYPU1BEKKunfmYgQuSKXFCeo851C5Y3XiZW3XA465TU:5zKtXEAq
      - name: token-customer-ip-address
        in: header
        description: The user's IP address if the user is currently logged in with the TPP. If the customer IP address is supplied (recommended), it is inferred that the user is present during the session (<i>i.e.</i>, the request is user-initiated; adding a `customer-initiated` = `true` header makes this explicit). For AIS calls, if the customer's IP address is not provided in the request, the bank assumes it is a TPP-initiated request and may limit the TPP to four TPP-initiated access attempts within a given 24-hour period.
        schema:
          type: string
          format: ipv4
        required: false
        example: 172.16.254.1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsResponse'
        '400':
          description: The client specified an invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '401':
          description: The authorization information is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_401'
        '403':
          description: Permission to access this endpoint is denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_403'
        '404':
          description: The requested entity, such as a payment, was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_404'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_429'
        '500':
          description: An unexpected or internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_500'
        '501':
          description: The operation was not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_501'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_503'
        '504':
          description: Gateway has timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_504'
      deprecated: false
      security:
      - Bearer: []
      - BasicAuth: []
      x-hideTryItPanel: true
    servers:
    - url: https://api.token.io
  /accounts/{accountId}:
    get:
      tags:
      - Accounts
      summary: Get account information
      description: The `GET /accounts/{accountId}` endpoint retrieves the information for a specific bank account.
      operationId: GatewayService.GetAccount
      parameters:
      - name: on-behalf-of
        in: header
        description: The `tokenId` represents the consent granted by the user (PSU).
        schema:
          type: string
        required: true
        example: ta:3eYPU1BEKKunfmYgQuSKXFCeo851C5Y3XiZW3XA465TU:5zKtXEAq
      - name: accountId
        in: path
        description: The system-generated, unique bank account id, which specifies the account for which the information is requested.
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: a:8DbPteGnytmMbKXdnWTReeRB6cYWKXZ84JgLTBC7fKL4:5zKcENpV
      - name: token-customer-ip-address
        in: header
        description: The user's IP address if the user is currently logged in with the TPP. If the customer  IP address is supplied (recommended), it is inferred that the user is present during the session (<i>i.e.</i>, the request is user-initiated; adding a `customer-initiated` = `true` header makes this explicit). For AIS calls, if the customer's IP address is not provided in the request, the bank assumes it is a TPP-initiated request and may limit the TPP to 4 TPP-initiated access attempts within a given 24-hour period.
        schema:
          type: string
          format: ipv4
        required: false
        example: 172.16.254.1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountResponse'
        '400':
          description: The client specified an invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '401':
          description: The authorization information is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_401'
        '403':
          description: Permission to access this endpoint is denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_403'
        '404':
          description: The requested entity, such as a payment, was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_404'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_429'
        '500':
          description: An unexpected or internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_500'
        '501':
          description: The operation was not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_501'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_503'
        '504':
          description: Gateway has timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_504'
      deprecated: false
      security:
      - Bearer: []
      - BasicAuth: []
      x-hideTryItPanel: true
    servers:
    - url: https://api.token.io
  /account-balance:
    get:
      tags:
      - Accounts
      summary: Get account balances
      description: The `GET /account-balance` endpoint retrieves the balances for multiple bank accounts.
      operationId: GatewayService.GetBalances
      parameters:
      - name: on-behalf-of
        in: header
        description: The `tokenId` represents the consent granted by the user (PSU).
        schema:
          type: string
        required: true
        example: ta:3eYPU1BEKKunfmYgQuSKXFCeo851C5Y3XiZW3XA465TU:5zKtXEAq
      - name: token-customer-ip-address
        in: header
        description: The user's IP address if the user is currently logged in with the TPP. If the customer  IP address is supplied (recommended), it is inferred that the user is present during the session (<i>i.e.</i>, the request is user-initiated; adding a `customer-initiated` = `true` header makes this explicit). For AIS calls, if the customer's IP address is not provided in the request, the bank assumes it is a TPP-initiated request and may limit the TPP to 4 TPP-initiated access attempts within a given 24-hour period.
        schema:
          type: string
          format: ipv4
        required: false
        example: 172.16.254.1
      - name: accountId
        in: query
        description: A list of account ids for which you wish to retrieve account balances. Each `accountId` should be specified separately as accountId=a:xxx:xxx&accountId=a:yyy:yyy.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example:
        - a:8DbPteGnytmMbKXdnWTReeRB6cYWKXZ84JgLTBC7fKL4:5zKcENpV
        - a:9TFpwkcQmcsMbdjQcpdjfsEBosDw28503fAAGPEMF2MVF19hfk3nc
        - a:rtmv254gaskGLdkadQvdNesk2Y9ferbvpaom5mvepm0mv2nfGnaix
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBalancesResponse'
        '400':
          description: The client specified an invalid argument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
        '401':
          description: The authorization information is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_401'
        '403':
          description: Permission to access this endpoint is denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_403'
        '404':
          description: The requested entity, such as a payment, was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_404'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_429'
        '500':
          description: An unexpected or internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_500'
        '501':
          description: The operation was not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_501'
        '503':
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_503'
        '504':
          description: Gateway has timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_504'
      deprecated: false
      security:
      - Bearer: []
      - BasicAuth: []
      x-hideTryItPanel: true
    servers:
    - url: https://api.token.io
  /accounts/{accountId}/balance:
