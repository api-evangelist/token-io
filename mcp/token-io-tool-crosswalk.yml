description: >-
  Crosswalk between Token.io's live MCP tools and its REST operations. The finding is a clean
  separation rather than an overlap: every one of the six MCP tools operates on the API
  DESCRIPTIONS, and not one of them binds to a Token.io REST operation. An agent connected to
  https://docs.token.io/mcp can read the whole contract set but cannot initiate a payment, set up a
  VRP consent, fetch an account or issue a refund — all 127 of those operations remain reachable
  only over HTTP against api.token.io with a JWT. So coverage is 0%, and that is a description of
  the surface rather than a defect in the mapping.
