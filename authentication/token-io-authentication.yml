searched:
  generated: '2026-09-17'
  detail: >-
    Upgraded from the derived securityScheme list by reading Token.io's own authentication pages.
    The material facts the spec alone does not carry:
  facts:
    - >-
      There is NO token endpoint and no OAuth flow on Token.io's own interface. The caller MINTS its
      own credential: a detached JWT signed with a key enrolled against the member id, covering the
      request method, path and body. Token.io recommends an `exp` under 10 minutes from the request.
    - >-
      HTTP Basic (the "BasicAuth" apiKey scheme in the spec) is accepted in the SANDBOX ONLY. The
      spec's own description says so; production accepts the JWT bearer only.
    - >-
      Keys are managed as first-class resources — POST/GET/DELETE /members/{memberId}/keys — and a
      key may carry an expiry. Key rotation is an API operation, not a support ticket.
    - >-
      A second, regulatory credential sits alongside the JWT: an eIDAS qualified certificate (QWAC /
      QSEAL), registered and verified through /eidas/register, /eidas/status and
      /eidas/verifications. Requests to banks are signed with it so the bank can check validity.
    - >-
      OAuth 2.0 does appear in the wider flow, but at the layer below — the payer authorises at
      their own bank and Token.io brokers that redirect. It is not how a TPP authenticates to
      Token.io.
  scopes: >-
    None. No oauth2 securityScheme exists in any harvested spec and no scope/permission reference is
    published, so no scopes/ artifact is claimed for this provider.
